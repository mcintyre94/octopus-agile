name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app

      - name: Build macOS app
        run: |
          xcodebuild build \
            -project octopus-menubar/OctopusMenubar.xcodeproj \
            -scheme OctopusMenubar \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty

      - name: Build iOS app
        run: |
          xcodebuild build \
            -project octopus-menubar/OctopusMenubar.xcodeproj \
            -scheme OctopusIOS \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty

      - name: Build widget extension
        run: |
          xcodebuild build \
            -project octopus-menubar/OctopusMenubar.xcodeproj \
            -scheme OctopusWidgetExtension \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty
